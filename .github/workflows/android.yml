name: Android

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 태그 빌드에서 Release에 APK 첨부
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x ./gradlew

      - name: Unit test (파서 · 포맷 · 스케줄)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: ./gradlew assembleDebug --console=plain

      # KEYSTORE_BASE64 secret이 없으면 서명 없이 계속 진행한다(빌드 실패 대신 경고).
      - name: Decode keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret이 없어 서명되지 않은 APK가 릴리스됩니다 (기기에 설치 불가)"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bus.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/bus.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bus-arrival-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            ## 설치

            아래 APK를 내려받아 "출처를 알 수 없는 앱 설치"를 허용하고 설치하세요. Android 8.0 이상.

            서명 상태: **${{ steps.keystore.outputs.signed == 'true' && '서명됨' || '서명 안 됨 — 설치 불가. 저장소 Secrets에 KEYSTORE_BASE64 등록 후 다시 태그를 푸시하세요.' }}**

            첫 실행 시 정류장 이름을 검색해 노선을 등록하면, 이후에는 홈 화면 위젯에서 바로 남은 시간을 볼 수 있습니다.

            > 이 앱은 서울시 버스 오픈API를 사용하며 상업적 이용이 금지되어 있습니다. 개인용으로만 사용하세요.
