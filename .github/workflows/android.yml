name: Android

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Release 생성 / APK 첨부
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x ./gradlew

      - name: Unit test (파서 · 포맷 · 스케줄)
        run: ./gradlew testDebugUnitTest --console=plain

      # PR은 릴리스를 만들지 않으므로 컴파일 검증만 한다.
      - name: Build debug APK (PR 검증용)
        if: github.event_name == 'pull_request'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: ./gradlew assembleDebug --console=plain

      # KEYSTORE_BASE64 secret이 없으면 서명 없이 계속 진행한다(빌드 실패 대신 경고).
      - name: Decode keystore
        id: keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret이 없어 서명되지 않은 APK가 릴리스됩니다 (기기에 설치 불가)"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bus.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/bus.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bus-arrival-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # main 푸시 = 항상 같은 'latest' 릴리스의 APK를 교체한다 (릴리스가 쌓이지 않음).
      - name: Update rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드 (main)
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            main 브랜치의 최신 커밋으로 자동 빌드된 APK입니다. 커밋마다 이 릴리스의 파일이 교체됩니다.

            - 커밋: ${{ github.sha }}
            - 빌드 번호(versionCode): ${{ github.run_number }}
            - 서명: **${{ steps.keystore.outputs.signed == 'true' && '서명됨' || '서명 안 됨 — 설치 불가. 저장소 Secrets에 KEYSTORE_BASE64 등록 후 다시 빌드하세요.' }}**

            안정판이 필요하면 아래 정식 버전 릴리스를 받으세요.

      # v1.2.3 태그 = 정식 버전 릴리스
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            ## 설치

            아래 APK를 내려받아 "출처를 알 수 없는 앱 설치"를 허용하고 설치하세요. Android 8.0 이상.

            서명 상태: **${{ steps.keystore.outputs.signed == 'true' && '서명됨' || '서명 안 됨 — 설치 불가. 저장소 Secrets에 KEYSTORE_BASE64 등록 후 다시 태그를 푸시하세요.' }}**

            첫 실행 시 정류장 이름을 검색해 노선을 등록하면, 이후에는 홈 화면 위젯에서 바로 남은 시간을 볼 수 있습니다.

            > 이 앱은 서울시 버스 오픈API를 사용하며 상업적 이용이 금지되어 있습니다. 개인용으로만 사용하세요.
